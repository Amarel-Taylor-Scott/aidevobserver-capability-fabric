[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aidevobserver-capability-fabric"
version = "0.2.0"
description = "Authenticated primitive registry, proof-carrying runtime, website, API, and MCP server for coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "AIDevObserver contributors" }
]
keywords = [
  "ai-agents",
  "developer-tools",
  "hybrid-search",
  "primitive-registry",
  "capability-fabric",
  "llm-observability"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Application Frameworks"
]

[project.urls]
Homepage = "https://github.com/Amarel-Taylor-Scott/aidevobserver-capability-fabric"
Issues = "https://github.com/Amarel-Taylor-Scott/aidevobserver-capability-fabric/issues"

[project.scripts]
aidevobserver-fabric = "aidevobserver_fabric.cli:main"
aidevobserver-mcp = "aidevobserver_fabric.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aidevobserver_fabric"]
