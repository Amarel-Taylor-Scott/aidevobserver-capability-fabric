[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aidevobserver-capability-fabric"
version = "0.1.0"
description = "Local-first capability registry, hybrid search, route bundles, and agent discovery fabric."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.18,<5",
  "rfc8785>=0.1.4,<0.2"
]

license = "MIT"
authors = [
  { name = "AIDevObserver contributors" }
]
keywords = [
  "ai-agents",
  "developer-tools",
  "hybrid-search",
  "primitive-registry",
  "capability-fabric",
  "llm-observability"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Application Frameworks"
]

[project.optional-dependencies]
ocg-interop = [
  "cwl-utils>=0.42,<0.43",
  "openapi-spec-validator>=0.9,<1",
  "pyagentspec>=26.1,<27"
]

[project.urls]
Homepage = "https://github.com/Amarel-Taylor-Scott/aidevobserver-capability-fabric"
Issues = "https://github.com/Amarel-Taylor-Scott/aidevobserver-capability-fabric/issues"

[project.scripts]
aidevobserver-fabric = "aidevobserver_fabric.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aidevobserver_fabric"]
